[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opendleto"
version = "0.1.0"
description = "Lightweight native Python port of Julia OpenDleto"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Peter A. Brooksbank"}, {name = "Martin D. Kassabov"}, {name = "James B. Wilson"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
lab = ["plotly>=5"]
dev = ["pytest>=8", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
